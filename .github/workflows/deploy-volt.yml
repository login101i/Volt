name: Deploy Volt to Hetzner

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'server/**'
      - 'docker-compose.volt.yml'
      - '.github/workflows/deploy-volt.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Volt on the VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VOLT_HOST }}
          username: ${{ secrets.VOLT_USER }}
          key: ${{ secrets.VOLT_SSH_KEY }}
          script: |
            set -eu
            cd /opt/volt
            git fetch origin main
            git reset --hard origin/main
            docker compose -p volt -f docker-compose.volt.yml build
            docker compose -p volt -f docker-compose.volt.yml up -d
            curl --fail --silent --show-error http://127.0.0.1:5000/health
            curl --fail --silent --show-error http://127.0.0.1:3100/ -o /dev/null
            curl --fail --silent --show-error http://127.0.0.1:3100/ | grep -q 'Projekt 2027'
            curl --fail --silent --show-error http://127.0.0.1:3100/panel | grep -q 'Panel narzędzi'
            docker compose -p volt -f docker-compose.volt.yml ps
